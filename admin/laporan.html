<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <script src="./tema.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b2a4a">
  <title>Laporan – EduSmart</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <script src="./data.js"></script>
  <script src="admin.js"></script>
  <script>
    var NAMA = { index: 'Beranda', dashboard: 'Dashboard', materi: 'Materi', kuis: 'Kuis', jadwal: 'Jadwal', progres: 'Progres', tentang: 'Tentang', profil: 'Profil' };

    function bars(L, key) {
      var mx = Math.max(5, Math.max.apply(null, L.map(function (x) { return x[key]; })));
      return '<div class="bars">' + L.map(function (x, n) {
        return '<div class="bc"><em>' + (x[key] || '') + '</em><div class="bt"><i data-h="' + x[key] / mx * 100 + '" class="' + (n == L.length - 1 ? 'now' : '') + '" title="' + x[key] + '"></i></div><span>' + x.d.getDate() + '/' + (x.d.getMonth() + 1) + '</span></div>';
      }).join('') + '</div>';
    }
    function stat(i, label, val, sub) {
      return '<div class="tile"><span class="ti">' + ic(i) + '</span><div><small>' + label + '</small><b' + (typeof val == 'number' ? ' data-count="' + val + '">0' : '>' + val) + '</b>' + (sub ? '<em>' + sub + '</em>' : '') + '</div></div>';
    }

    async function init(b) {
      b.innerHTML = '<p class="mut">Memuat laporan…</p>';
      var st, us;
      try {
        var r = await Promise.all([F.get(R('statistik')), F.get(R('users'))]);
        st = r[0].val() || {};
        us = r[1].val() || {};
      }
      catch (e) {
        b.innerHTML = '<p class="empty">Gagal memuat data. Periksa koneksi dan pastikan aturan database sudah dipasang, lalu coba lagi.</p>';
        return;
      }
      var H = st.harian || {}, hr = [], d0 = new Date(), tot = 0, uni = 0, now = Date.now();
      for (var k = 13; k >= 0; k--) {
        var d = new Date(d0);
        d.setDate(d0.getDate() - k);
        var o = H[iso(d)] || {};
        hr.push({ d: d, t: +o.total || 0, u: +o.unik || 0 });
      }
      Object.keys(H).forEach(function (x) { tot += +H[x].total || 0; uni += +H[x].unik || 0; });
      var hi = H[iso(d0)] || {}, w7 = hr.slice(-7).reduce(function (a, x) { return a + x.t; }, 0),
        ids = Object.keys(us), aktif7 = 0, baru7 = 0;
      ids.forEach(function (id) {
        var u = us[id] || {};
        if (+u.terakhirLogin >= now - 7 * 864e5) aktif7++;
        if (+u.dibuat >= now - 7 * 864e5) baru7++;
      });
      var hal = Object.keys(st.halaman || {}).map(function (x) { return [x, +st.halaman[x] || 0]; }).sort(function (a, b) { return b[1] - a[1]; }),
        jum = hal.reduce(function (a, x) { return a + x[1]; }, 0);

      b.innerHTML =
        '<div class="grid3">' + stat('eye', 'Total kunjungan', tot, '7 hari terakhir: ' + w7) + stat('users', 'Pengunjung unik', uni, 'dihitung per perangkat per hari') + stat('clock', 'Hari ini', +hi.total || 0, (+hi.unik || 0) + ' pengunjung unik') + '</div>' +
        '<div class="grid3">' + stat('user', 'Pengguna terdaftar', ids.length) + stat('bolt', 'Login 7 hari terakhir', aktif7) + stat('check', 'Pengguna baru 7 hari', baru7) + '</div>' +
        '<div class="grid2"><section class="card"><h2>Kunjungan per hari (14 hari)</h2>' + bars(hr, 't') + '</section>' +
        '<section class="card"><h2>Pengunjung unik per hari</h2>' + bars(hr, 'u') + '</section></div>' +
        '<section class="card"><h2>Halaman paling sering dibuka</h2>' + (hal.length ? hal.map(function (x) {
          return '<div class="hl"><b>' + esc(NAMA[x[0]] || x[0]) + '</b><div class="pb"><i data-w="' + Math.round(x[1] / jum * 100) + '"></i></div><span>' + x[1] + '</span></div>';
        }).join('') : '<p class="empty">Belum ada data kunjungan.</p>') +
        '<p class="nt">Kunjungan dihitung setiap halaman dibuka, sejak pencatatan ini dipasang. Kunjunganmu sendiri sebagai admin tidak dihitung.</p></section>';
      setTimeout(function () { grow(b); }, 60);
    }

    adminStart({ page: 'laporan', title: 'Laporan', sub: 'Pantau kunjungan situs dan aktivitas pengguna.', init: init });
  </script>
</body>

</html>
